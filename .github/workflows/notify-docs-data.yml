name: Notify pepkit docs (data)

# Tells databio/doc-hubs that this repo's docs changed, so pep.databio.org
# rebuilds. All the logic is in the reusable workflow; this file only names
# which site and which spoke. See databio/doc-hubs README, "Add a spoke".

on:
  push:
    # Must equal this spoke's `ref` in hubs/pepkit/spokes.toml — the hub builds
    # that ref, so notifying from any other branch would rebuild the same bytes.
    branches: [master]
    paths:
      - 'docs/data/**'                  # the spoke's docs tree, docs.yml included
      - '.github/workflows/notify-docs-data.yml'  # so a notifier fix proves itself
  workflow_dispatch:

jobs:
  notify:
    uses: databio/actions/.github/workflows/notify-doc-hub.yml@master
    with:
      site: pepkit
      spoke: data
    secrets:
      DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
