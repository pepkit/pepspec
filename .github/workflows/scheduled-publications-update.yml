name: Manual publications update with Claude

# Manual fallback for the publications updater.
# The recurring monthly schedule is handled by Jules.
#
# All discovery, verification, filtering, and validation rules live in
# automation/update-publications.md. The Claude skill is only a thin wrapper
# that handles Claude-specific branch and pull-request publication behavior.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: read

concurrency:
  group: publications-update
  cancel-in-progress: false

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run Claude Code to find new publications
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            Use the update-publications skill to run the recurring PEPkit
            publications update. Follow the canonical instructions in
            automation/update-publications.md and open or update the review PR
            as directed by the Claude wrapper.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(*),Read(*),Write(*),Edit(*),Glob(*),Grep(*),WebFetch(*)"'
          show_full_output: true
